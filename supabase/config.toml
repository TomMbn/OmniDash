# verify_jwt = false pour toutes les fonctions : la vérification de la passerelle
# ne reconnaît que l'ancien secret, alors que le projet signe ses jetons en ES256.
# Chaque fonction vérifie donc elle-même l'appelant avec auth.getUser.
# check-windows, appelée par la tâche planifiée, exige son secret (CRON_SECRET).

[functions.withings-sync]
enabled = true
verify_jwt = false
import_map = "./functions/withings-sync/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/withings-sync/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/withings-sync/*.html" ]

[functions.netatmo-sync]
enabled = true
verify_jwt = false
import_map = "./functions/netatmo-sync/deno.json"
entrypoint = "./functions/netatmo-sync/index.ts"

[functions.save-push-subscription]
enabled = true
verify_jwt = false
import_map = "./functions/save-push-subscription/deno.json"
entrypoint = "./functions/save-push-subscription/index.ts"

[functions.check-windows]
enabled = true
verify_jwt = false
import_map = "./functions/check-windows/deno.json"
entrypoint = "./functions/check-windows/index.ts"

[functions.ai-stylist]
verify_jwt = false

[functions.analyze-nutrition]
verify_jwt = false

[functions.categorize-transactions]
verify_jwt = false

[functions.generate-travel]
verify_jwt = false

[functions.smart-add-item]
verify_jwt = false
